name: Enforce owner-only pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  owner-only:
    if: github.event.pull_request.user.login != 'claudiumio'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `Obrigado pela contribuição, @${pr.user.login}!`,
                ``,
                `Este projeto só aceita Pull Requests do mantenedor. Por favor, reenvie sua mudança como uma issue do tipo **🛠️ Correção** (com o diff anexado) — ela será revisada e, se aceita, entra no código com crédito a você.`,
                ``,
                `Detalhes em [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md).`
              ].join('\n')
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });
